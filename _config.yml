baseurl: "/lined-paper"
permalink: /blog/:year/:month/:day/:title

collections:
  authors:
    output: true # Creates a page for each author

blog-name: "Lined Paper"
paginate: 6
paginate_path: "/page:num/"

jekyll-archives:
  enabled: 'all'
  layout: archive
  permalinks:
    year: '/blog/:year/'
    month: '/blog/:year/:month/'
    day: '/blog/:year/:month/:day/'
    tag: '/tag/:name/'
    category: '/category/:name/'

# Front Matter defaults
defaults:
  - scope:
      path: ""
      type: "authors"
    values:
      layout: "author"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

  - scope:
      path: ""
    values:
      layout: "default"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-archives
  - jekyll-paginate

